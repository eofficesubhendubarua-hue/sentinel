[build]
  publish = "public"
  command = ""

[[redirects]]
  from = "/api/yahoo-chart/*"
  to = "https://query1.finance.yahoo.com/v8/finance/chart/:splat"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "*", Access-Control-Allow-Headers = "Content-Type, Accept"}

[[redirects]]
  from = "/api/yahoo-quote/*"
  to = "https://query2.finance.yahoo.com/v10/finance/quoteSummary/:splat"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "*", Access-Control-Allow-Headers = "Content-Type, Accept"}

[[redirects]]
  from = "/api/yahoo-search"
  to = "https://query2.finance.yahoo.com/v1/finance/search"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "*", Access-Control-Allow-Headers = "Content-Type, Accept"}
